<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Computer Map · 컴퓨터 지도</title>
  <meta name="description" content="Computer Map · 컴퓨터 지도 — 하드웨어와 소프트웨어의 속을 따라가 보는 지도" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link rel="stylesheet" href="css/style.css?v=1112j" />
</head>
<body class="mono" style="--sat:0">
  <div class="glow" aria-hidden="true"></div>

  <header class="top">
    <p class="eyebrow">COMPUTER MAP</p>
  </header>

  <main class="stage">
    <svg class="scene" id="scene" viewBox="40 110 720 620" role="img" aria-label="하드웨어 위에 소프트웨어가 얹혀 있는 그림">
      <defs>
        <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#1d1638" />
          <stop offset="1" stop-color="#110d22" />
        </linearGradient>
        <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#c4b5fd" stop-opacity=".9" />
          <stop offset="1" stop-color="#c4b5fd" stop-opacity=".05" />
        </linearGradient>
      </defs>

      <!-- ===== 연결 빔 (SW ↔ HW) ===== -->
      <g class="beams" aria-hidden="true">
        <polygon class="footprint" points="250,560 400,485 550,560 400,635" />
        <line class="beam" x1="250" y1="304" x2="250" y2="560" />
        <line class="beam" x1="550" y1="304" x2="550" y2="560" />
        <line class="beam" x1="400" y1="380" x2="400" y2="520" />
        <line class="beam beam--flow" x1="250" y1="560" x2="250" y2="304" pathLength="100" />
        <line class="beam beam--flow" x1="550" y1="560" x2="550" y2="304" pathLength="100" style="animation-delay:-1.1s" />
        <line class="beam beam--flow" x1="400" y1="520" x2="400" y2="380" pathLength="100" style="animation-delay:-.5s" />
      </g>

      <!-- ===== HARDWARE ===== -->
      <a class="layer hw" href="hardware.html" aria-label="하드웨어 지식 보기">
        <g class="enter">
          <!-- 기판 -->
          <polygon class="side side--l" points="190,560 400,665 400,681 190,576" />
          <polygon class="side side--r" points="400,665 610,560 610,576 400,681" />
          <polygon class="face st" points="190,560 400,455 610,560 400,665" />

          <!-- 기판 윗면 (평면 좌표 → 아이소메트릭 변환) -->
          <g transform="matrix(1 .5 -1 .5 400 560)">
            <rect class="st faint" x="-98" y="-98" width="196" height="196" rx="6" fill="none" />
            <g class="traces">
              <path d="M34 -16 H60 V-50 H90" /><path d="M34 0 H95" /><path d="M34 16 H55 V46 H86" />
              <path d="M-34 -16 H-70 V-62" /><path d="M-34 8 H-90" /><path d="M-34 22 H-55 V70 H-80" />
              <path d="M-16 34 V60 H-40 V90" /><path d="M0 34 V95" /><path d="M16 34 V55 H50 V86" />
              <path d="M-16 -34 V-90" /><path d="M4 -34 V-60 H40 V-86" /><path d="M20 -34 V-45 H76" />
            </g>
            <g class="pulses">
              <path d="M34 -16 H60 V-50 H90" pathLength="100" /><path d="M-34 8 H-90" pathLength="100" style="animation-delay:-.8s" />
              <path d="M16 34 V55 H50 V86" pathLength="100" style="animation-delay:-1.6s" /><path d="M-16 -34 V-90" pathLength="100" style="animation-delay:-2.2s" />
              <path d="M0 34 V95" pathLength="100" style="animation-delay:-1.2s" /><path d="M-34 22 H-55 V70 H-80" pathLength="100" style="animation-delay:-2.7s" />
            </g>
            <g class="nodes">
              <circle cx="90" cy="-50" r="3" /><circle cx="95" cy="0" r="3" /><circle cx="86" cy="46" r="3" />
              <circle cx="-70" cy="-62" r="3" /><circle cx="-90" cy="8" r="3" /><circle cx="-80" cy="70" r="3" />
              <circle cx="-40" cy="90" r="3" /><circle cx="0" cy="95" r="3" /><circle cx="50" cy="86" r="3" />
              <circle cx="-16" cy="-90" r="3" /><circle cx="40" cy="-86" r="3" /><circle cx="76" cy="-45" r="3" />
            </g>
            <!-- 부품 -->
            <rect class="st part" x="56" y="58" width="22" height="10" rx="2" />
            <rect class="st part" x="-88" y="-34" width="10" height="20" rx="2" />
            <rect class="st part" x="-90" y="-92" width="54" height="10" rx="2" />
            <rect class="st part" x="62" y="-90" width="10" height="26" rx="2" />
            <!-- 핀 -->
            <g class="pins">
              <path d="M-24 -30 v-5 M-12 -30 v-5 M0 -30 v-5 M12 -30 v-5 M24 -30 v-5
                       M-24 30 v5 M-12 30 v5 M0 30 v5 M12 30 v5 M24 30 v5
                       M-30 -24 h-5 M-30 -12 h-5 M-30 0 h-5 M-30 12 h-5 M-30 24 h-5
                       M30 -24 h5 M30 -12 h5 M30 0 h5 M30 12 h5 M30 24 h5" />
            </g>
          </g>

          <!-- CPU 칩 -->
          <polygon class="side side--l chip" points="344,546 400,574 400,588 344,560" />
          <polygon class="side side--r chip" points="400,574 456,546 456,560 400,588" />
          <polygon class="face st chip-top" points="344,546 400,518 456,546 400,574" />
          <g transform="matrix(1 .5 -1 .5 400 546)">
            <rect class="st core" x="-16" y="-16" width="32" height="32" rx="2" />
            <path class="st faint" d="M-16 -5 H16 M-16 5 H16 M-5 -16 V16 M5 -16 V16" />
            <circle class="dot" cx="-22" cy="-22" r="2.2" />
          </g>
        </g>
      </a>

      <!-- ===== SOFTWARE ===== -->
      <a class="layer sw" href="software.html" aria-label="소프트웨어 지식 보기">
        <g class="enter">
          <g class="float">
            <!-- 앱 패널 -->
            <polygon class="side side--l" points="250,300 400,375 400,385 250,310" />
            <polygon class="side side--r" points="400,375 550,300 550,310 400,385" />
            <polygon class="face st" points="250,300 400,225 550,300 400,375" />
            <g transform="matrix(1 .5 -1 .5 400 300)">
              <path class="st faint" d="M-75 -55 H75" />
              <circle cx="-65" cy="-65" r="2.6" fill="#f472b6" />
              <circle cx="-57" cy="-65" r="2.6" fill="#fbbf24" />
              <circle cx="-49" cy="-65" r="2.6" fill="#34d399" />
              <g class="code">
                <rect class="c1" x="-62" y="-44" width="30" height="5" rx="2" /><rect x="-28" y="-44" width="50" height="5" rx="2" />
                <rect x="-54" y="-33" width="40" height="5" rx="2" /><rect class="c2" x="-10" y="-33" width="30" height="5" rx="2" />
                <rect x="-54" y="-22" width="62" height="5" rx="2" />
                <rect class="c3" x="-46" y="-11" width="25" height="5" rx="2" /><rect x="-17" y="-11" width="45" height="5" rx="2" />
                <rect x="-46" y="0" width="72" height="5" rx="2" />
                <rect x="-54" y="11" width="35" height="5" rx="2" />
                <rect class="c1" x="-62" y="22" width="20" height="5" rx="2" /><rect x="-38" y="22" width="40" height="5" rx="2" />
                <rect class="c2" x="-62" y="33" width="55" height="5" rx="2" />
                <rect class="cursor" x="-62" y="46" width="7" height="6" rx="1" />
              </g>
            </g>

            <!-- 떠 있는 </> 타일 -->
            <g class="tile">
              <polygon class="side side--l" points="352,186 400,210 400,218 352,194" />
              <polygon class="side side--r" points="400,210 448,186 448,194 400,218" />
              <polygon class="face st" points="352,186 400,162 448,186 400,210" />
              <g transform="matrix(1 .5 -1 .5 400 186)">
                <path class="st glyph" d="M-10 -11 L-19 0 L-10 11 M10 -11 L19 0 L10 11 M5 -15 L-5 15" />
              </g>
            </g>
          </g>
        </g>
      </a>

      <!-- ===== 라벨 ===== -->
      <g class="label label--sw" aria-hidden="true">
        <path class="leader" d="M555 262 L600 240 H690" />
        <text x="690" y="230" text-anchor="end" class="label__en">SOFTWARE</text>
        <text x="690" y="262" text-anchor="end" class="label__ko">소프트웨어</text>
      </g>
      <g class="label label--hw" aria-hidden="true">
        <path class="leader" d="M215 600 L170 650 H80" />
        <text x="80" y="640" class="label__en">HARDWARE</text>
        <text x="80" y="672" class="label__ko">하드웨어</text>
      </g>
    </svg>
  </main>

  <p class="hint">탐색할 영역에 포인터를 올려보세요</p>

  <script src="js/hover.js?v=1112n"></script>
  <script src="js/main.js?v=1111n"></script>
</body>
</html>
